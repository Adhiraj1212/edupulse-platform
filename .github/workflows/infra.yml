name: platform-infra-ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose & Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --no-banner --verbose

      - name: Verify Compose Files
        run: |
          docker compose -f infra/docker-compose.yaml --env-file infra/.env.example config --quiet
          docker compose -f deploy/docker-compose.yml --env-file infra/.env.example config --quiet

      - name: Shellcheck DB init script
        run: shellcheck infra/db/init.sh

  deploy:
    name: Deploy Platform & Data Tier to EC2 via SSM
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-infra
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::265020546803:role/GitHubActions-devops-ec2ssm-github-Role-Adhiraj' }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Deploy Platform Stack via AWS SSM
        run: |
          bash scripts/ssm-run-platform.sh "${{ vars.INSTANCE_ID || 'i-06d3ce74e7868fc6d' }}"
