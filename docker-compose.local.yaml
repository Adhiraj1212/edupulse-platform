# Local run of the WHOLE system on one machine: the infra stack (included as-is) plus
# the four application services that run on ECS in production.
#
#   bash scripts/gen-env.sh      # once: creates infra/.env and .env.local
#   bash scripts/local-up.sh     # build + start
#
# The services read every endpoint and secret from environment variables, so the same
# images run on ECS with DB_HOST/REDIS_URL/RABBITMQ_URL pointing at the EC2 host.

name: edupulse

include:
  - path: infra/docker-compose.yaml

services:
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:8080"
    environment:
      AUTH_UPSTREAM: auth-service:4000
      BACKEND_UPSTREAM: backend:5000
      AUDIT_UPSTREAM: audit-service:6000
      DNS_RESOLVER: 127.0.0.11
    networks: [edge]
    depends_on:
      auth-service: { condition: service_healthy }
      backend: { condition: service_healthy }
      audit-service: { condition: service_healthy }
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edupulse}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STUDENT_USER: ${STUDENT_USER}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [edge, default]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-student}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-student_db}
      DB_TABLE: students
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edupulse}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks: [edge, default]
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  audit-service:
    build: ./audit-service
    environment:
      DB_HOST: db
      DB_USER: audit
      DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      DB_DATABASE: audit_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edupulse}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    networks: [edge, default]
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

# `edge`: frontend <-> services. `default`: services <-> infra. The frontend never
# shares a network with the data stores.
networks:
  edge: {}
